<title>Atomiss Kumpir | Menü</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0a09;--card:#14110e;--ink:#f3e9d6;--muted:#9a8f7d;--gold:#c8a45a;--gold2:#e6c97f;--red:#d8412f;--line:#2b241b}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 58px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
.hero{position:relative;text-align:center;padding:46px 24px 30px;background:radial-gradient(520px 260px at 50% 0,#2a1d10 0,transparent 70%)}
.brand{font-family:"Trebuchet MS",Arial,sans-serif;font-weight:800;font-size:2.6rem;letter-spacing:-1px;color:var(--red);margin:0;line-height:1}
.title{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:2.1rem;letter-spacing:.42em;margin:8px 0 0 .42em;color:var(--ink)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 12px;color:var(--gold)}
.orn i{display:block;height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}.orn i:last-child{transform:scaleX(-1)}
.orn b{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
.tag{margin:0;color:var(--muted);font-size:.92rem;letter-spacing:.06em}
nav{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:#0b0a09ee;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px;scrollbar-width:none;max-width:640px;margin:0 auto}.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:var(--muted);text-decoration:none;font-weight:500;font-size:.88rem;letter-spacing:.04em;padding:16px 12px 13px;border-bottom:2px solid transparent;transition:color .25s,border-color .25s}
.tabs a.on{color:var(--gold2);border-color:var(--gold)}
.tabs a:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
main{max-width:640px;margin:0 auto;padding:8px 20px 30px}
section{margin-top:34px}
.ph{position:relative;height:200px;border-radius:16px;overflow:hidden;box-shadow:0 14px 34px #000a,0 0 0 1px #ffffff12}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);transition:transform 1.4s ease}
.in .ph img{transform:scale(1)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#0b0a09f2 100%)}
.ph h2{position:absolute;left:18px;bottom:14px;z-index:1;margin:0}
h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:1.65rem;color:var(--gold2);letter-spacing:.02em}
.nophoto{display:flex;align-items:center;gap:14px}.nophoto h2{margin:0}.nophoto i{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.sub{margin:10px 0 0;color:var(--muted);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.list{margin-top:6px}
.item{display:flex;align-items:baseline;gap:10px;padding:15px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.n{font-weight:500;font-size:1.02rem}
.d{flex:1;border-bottom:1px dotted #4a3f2e;transform:translateY(-4px);min-width:14px}
.p{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:1.2rem;color:var(--gold2);font-variant-numeric:lining-nums;white-space:nowrap}
.p small{font-family:Inter,sans-serif;font-size:.75rem;color:var(--gold);margin-left:3px;font-weight:500}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
.cta{max-width:640px;margin:10px auto 0;padding:0 20px}
.cta .box{border:1px solid #c8a45a55;border-radius:18px;padding:26px 20px;text-align:center;background:linear-gradient(180deg,#1a140d,#100d0a)}
.cta h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:1.5rem;color:var(--gold2);margin:0 0 6px}
.cta p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
.igb{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:linear-gradient(180deg,#e6c97f,#c8a45a);color:#1b1408;font-weight:600;text-decoration:none;font-size:.98rem;box-shadow:0 8px 20px #0007}
.igb svg{width:20px;height:20px}
.igb:active{transform:scale(.97)}
.dl{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink);font-size:.92rem}
.dl span,.dl a{text-decoration:none;display:inline-block;margin:10px 4px 0;padding:7px 14px;border:1px solid #c8a45a77;border-radius:999px;color:var(--gold2);font-size:.82rem;font-weight:500;letter-spacing:.03em}
footer{text-align:center;padding:26px 24px 44px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);max-width:640px;margin:0 auto}
footer b{display:block;font-family:"Playfair Display",Georgia,serif;font-weight:500;color:var(--ink);font-size:1.05rem;margin-bottom:8px;letter-spacing:.04em}
footer a{color:var(--gold2);text-decoration:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv,.ph img{transition:none;opacity:1;transform:none}}
</style></head><body>

var tabs=document.getElementById("tabs"),main=document.getElementById("menu");
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
MENU.forEach(function(c,i){
var a=el("a","",c.k);a.href="#s"+i;a.id="t"+i;tabs.appendChild(a);
var s=el("section","rv");s.id="s"+i;
if(c.img){var ph=el("div","ph"),im=document.createElement("img");im.src=IMG[c.img];im.alt=c.k;im.loading="lazy";ph.appendChild(im);ph.appendChild(el("h2","",c.k));s.appendChild(ph);}
